name: Проверки
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        base: ["/", "/Ekzamen-9-klass-rus/"]
    env:
      OGE_BASE_PATH: ${{ matrix.base }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run content:validate
      - run: npm run build
      - run: npx playwright install chromium --only-shell
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ strategy.job-index }}
          path: test-results/

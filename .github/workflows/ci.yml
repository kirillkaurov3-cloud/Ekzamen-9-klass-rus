name: Проверки
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run content:validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --output=test-results/root
      - run: npm run test:e2e -- --output=test-results/prefix
        env:
          OGE_BASE_PATH: /repo/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
